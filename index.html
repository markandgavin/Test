<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Vending Machine QC</title>
<style>
  :root {
    --bg: #f1f5f9; --card: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --brand: #2563eb; --brand-ink: #ffffff; --ok: #16a34a; --ok-bg: #dcfce7;
    --danger: #dc2626; --danger-bg: #fee2e2; --warn-bg: #fef9c3; --warn-ink: #854d0e;
    --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 1px 2px rgba(15, 23, 42, .06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  .app {
    max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header.bar { padding: 16px 18px 12px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  header.bar h1 { font-size: 17px; margin: 0; letter-spacing: .2px; flex: 1; }
  .link-btn {
    -webkit-appearance: none; appearance: none; background: none; border: none;
    color: var(--brand); font-size: 15px; font-weight: 600; cursor: pointer; padding: 6px 4px;
  }
  .icon-btn {
    -webkit-appearance: none; appearance: none; background: none; border: none;
    font-size: 20px; cursor: pointer; padding: 4px 6px; line-height: 1; color: var(--muted);
  }
  .save-status { font-size: 12px; color: var(--muted); min-height: 15px; margin-top: 6px; }
  .save-status.err { color: var(--danger); }
  .save-status.ok { color: var(--ok); }
  .progress { margin-top: 8px; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .progress .track { flex: 1; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .progress .fill { height: 100%; width: 0%; background: var(--brand); border-radius: 999px; transition: width .25s ease; }
  main { flex: 1; padding: 6px 18px 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; }
  .card + .card { margin-top: 14px; }
  .step-label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--brand); margin: 0 0 4px; }
  h2.title { margin: 0 0 4px; font-size: 22px; }
  h2.title.big { font-size: 26px; }
  p.hint { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  p.hint.tight { margin: 0 0 10px; }
  label.field { display: block; font-size: 14px; font-weight: 600; margin: 0 0 6px; }
  input[type="text"], input[type="password"] {
    width: 100%; font-size: 18px; padding: 14px 14px; border: 1.5px solid var(--line);
    border-radius: 12px; background: #fff; color: var(--ink); outline: none;
  }
  input.hero { font-size: 24px; padding: 16px 16px; text-align: center; font-weight: 700; }
  input:focus { border-color: var(--brand); }
  .mono { font-variant-ligatures: none; letter-spacing: .5px; }
  .error { color: var(--danger); font-size: 13px; margin: 8px 0 0; min-height: 16px; }
  .capture { margin-top: 6px; }
  .capture input[type="file"] { display: none; }
  .shot { display: flex; flex-direction: column; gap: 12px; }
  .preview {
    width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; border: 1.5px dashed var(--line);
    background: #f8fafc; display: flex; align-items: center; justify-content: center;
    color: var(--muted); overflow: hidden; text-align: center; padding: 12px; font-size: 14px;
  }
  .preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .preview.filled { border-style: solid; border-color: var(--ok); }
  .btn {
    -webkit-appearance: none; appearance: none; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; padding: 15px 18px; cursor: pointer; width: 100%; text-align: center;
  }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); }
  .btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn.small { width: auto; padding: 11px 16px; font-size: 14px; }
  .nav { display: flex; gap: 12px; margin-top: 18px; }
  .nav .btn { flex: 1; }
  .home-head { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 14px; }
  .home-head h2 { margin: 0; font-size: 22px; }
  .home-head .count { color: var(--muted); font-size: 14px; }
  .banner { border-radius: 12px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 14px; }
  .banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .banner.err { background: var(--danger-bg); color: var(--danger); }
  .banner a, .banner .as-link { color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
  .machine-list { display: flex; flex-direction: column; gap: 12px; }
  .machine {
    display: flex; align-items: center; gap: 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px;
  }
  .machine .open { flex: 1; display: flex; align-items: center; gap: 14px; cursor: pointer; min-width: 0; }
  .machine .ring {
    flex: none; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--brand);
    background: conic-gradient(var(--brand) var(--pct,0%), var(--line) 0);
  }
  .machine .ring span { width: 38px; height: 38px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; }
  .machine .meta { min-width: 0; }
  .machine .site { font-size: 18px; font-weight: 700; }
  .machine .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .machine .del { -webkit-appearance: none; appearance: none; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 8px; flex: none; line-height: 1; }
  .machine .del:hover { color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 36px 16px; }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 30px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fab-row { margin-top: 16px; }
  .summary-line { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .summary-line .k { color: var(--muted); }
  .summary-line .v { font-weight: 600; text-align: right; }
  .summary-line.primary .v { font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
  .tile { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
  .tile .thumb { aspect-ratio: 4 / 3; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
  .tile .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .tile .cap { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; font-size: 13px; font-weight: 600; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .badge.have { background: var(--ok-bg); color: var(--ok); }
  .badge.missing { background: var(--danger-bg); color: var(--danger); }
  .help { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .help ol { margin: 6px 0 0; padding-left: 18px; }
  .help li { margin: 3px 0; }
  #report { display: none; }
  @media print {
    @page { margin: 12mm; }
    body { background: #fff; }
    .app { display: none !important; }
    #report { display: block !important; }
    .rpt-header { margin-bottom: 8mm; border-bottom: 2px solid #0f172a; padding-bottom: 5mm; }
    .rpt-header h1 { margin: 0 0 4mm; font-size: 22px; }
    .rpt-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 8mm; font-size: 13px; }
    .rpt-meta .k { color: #475569; }
    .rpt-meta .v { font-weight: 700; }
    .rpt-photo { page-break-inside: avoid; break-inside: avoid; page-break-before: always; }
    .rpt-photo h2 { font-size: 16px; margin: 0 0 3mm; }
    .rpt-photo .frame { width: 100%; height: 220mm; display: flex; align-items: center; justify-content: center; border: 1px solid #cbd5e1; }
    .rpt-photo img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .rpt-photo .none { color: #dc2626; font-weight: 700; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="bar">
    <div class="bar-row">
      <button class="link-btn" id="homeBtn" style="display:none">‹ Machines</button>
      <h1>Vending Machine QC</h1>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
    <div class="save-status" id="saveStatus"></div>
    <div class="progress" id="progressWrap" style="display:none">
      <span id="stepCount">Start</span>
      <span class="track"><span class="fill" id="progressFill"></span></span>
    </div>
  </header>
  <main id="screen"></main>
</div>

<div id="report"></div>

<script>
(function () {
  "use strict";

  /* ---- Checklist config: edit / reorder / add items here ---- */
  var CHECKLIST = [
    { id: "peplink",    label: "Peplink" },
    { id: "optconnect", label: "OptConnect" },
    { id: "nuc",        label: "Nuc" },
    { id: "badge",      label: "Badge" },
    { id: "inside",     label: "Inside" },
    { id: "outside",    label: "Outside" },
    { id: "keys",       label: "Keys" },
    { id: "crate",      label: "Crate with label" }
  ];

  var MAX_EDGE = 1600;
  var TOTAL_SHOTS = 1 + CHECKLIST.length;

  /* =============================================================
   * GitHub-backed storage.
   * Each machine is one file:  forms/<id>.json  (full record incl. base64 photos)
   * A manifest  index.json  holds light metadata for the home list.
   * Reads use raw.githubusercontent (public, no token). Writes use the
   * GitHub Contents API with a token the user pastes (kept only in
   * this browser's localStorage — never committed).
   * =========================================================== */
  var GH = {
    owner: "markandgavin",
    repo: "Test",
    branch: "claude/vending-machine-qc-form-hkzq5d",
    api: "https://api.github.com"
  };
  var INDEX_PATH = "index.json";
  var shaCache = {};       // path -> latest known blob sha
  var indexCache = null;   // in-memory manifest array (authoritative for this session)

  function formPath(id) { return "forms/" + id + ".json"; }
  function apiUrl(path) { return GH.api + "/repos/" + GH.owner + "/" + GH.repo + "/contents/" + path; }
  // refs/heads/ form disambiguates branch names that contain slashes.
  function rawUrl(path) { return "https://raw.githubusercontent.com/" + GH.owner + "/" + GH.repo + "/refs/heads/" + GH.branch + "/" + path; }

  function getToken() { try { return localStorage.getItem("gh_token") || ""; } catch (e) { return ""; } }
  function setToken(t) { try { if (t) localStorage.setItem("gh_token", t); else localStorage.removeItem("gh_token"); } catch (e) {} }
  function hasToken() { return !!getToken(); }

  function b64EncodeUnicode(str) { return btoa(unescape(encodeURIComponent(str))); }
  function b64DecodeUnicode(b64) { return decodeURIComponent(escape(atob(b64))); }

  function ghHeaders() {
    var h = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
    if (hasToken()) h["Authorization"] = "Bearer " + getToken();
    return h;
  }

  // Read JSON from the repo (public, any size). Returns parsed JSON or null (404).
  function ghReadJson(path) {
    return fetch(rawUrl(path) + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error("Read failed (" + r.status + ")");
      return r.json();
    });
  }

  // Fetch the current blob sha for a path (needs token). null if file doesn't exist.
  function ghGetSha(path) {
    if (shaCache[path]) return Promise.resolve(shaCache[path]);
    return fetch(apiUrl(path) + "?ref=" + GH.branch, { headers: ghHeaders(), cache: "no-store" }).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error("GitHub read (" + r.status + ")");
      return r.json().then(function (d) { shaCache[path] = d.sha; return d.sha; });
    });
  }

  function ghPut(path, obj, message) {
    if (!hasToken()) return Promise.reject(new Error("NO_TOKEN"));
    function attempt(sha) {
      var body = { message: message || ("Update " + path), content: b64EncodeUnicode(JSON.stringify(obj)), branch: GH.branch };
      if (sha) body.sha = sha;
      return fetch(apiUrl(path), {
        method: "PUT",
        headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()),
        body: JSON.stringify(body)
      }).then(function (r) {
        if (r.status === 409 || r.status === 422) {
          // stale sha — refresh and retry once
          shaCache[path] = null;
          return ghGetSha(path).then(function (fresh) {
            var b2 = { message: body.message, content: body.content, branch: GH.branch };
            if (fresh) b2.sha = fresh;
            return fetch(apiUrl(path), { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()), body: JSON.stringify(b2) });
          });
        }
        return r;
      }).then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error("Save failed (" + r.status + "). " + shortErr(t)); });
        return r.json().then(function (d) { if (d.content) shaCache[path] = d.content.sha; return d; });
      });
    }
    return ghGetSha(path).then(attempt);
  }

  function ghDelete(path, message) {
    if (!hasToken()) return Promise.reject(new Error("NO_TOKEN"));
    return ghGetSha(path).then(function (sha) {
      if (!sha) return; // already gone
      return fetch(apiUrl(path), {
        method: "DELETE",
        headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()),
        body: JSON.stringify({ message: message || ("Delete " + path), sha: sha, branch: GH.branch })
      }).then(function (r) { if (!r.ok) throw new Error("Delete failed (" + r.status + ")"); shaCache[path] = null; });
    });
  }

  function shortErr(t) {
    try { var j = JSON.parse(t); return j.message || ""; } catch (e) { return (t || "").slice(0, 120); }
  }

  // ---- Storage API (same shape the app already uses) ----
  function loadIndex() {
    return ghReadJson(INDEX_PATH).then(function (arr) {
      indexCache = Array.isArray(arr) ? arr : [];
      return indexCache;
    });
  }
  function allMachines() {
    var p = indexCache ? Promise.resolve(indexCache) : loadIndex();
    return p.then(function (arr) {
      return arr.slice().sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
    });
  }
  function getMachine(id) { return ghReadJson(formPath(id)); }

  function photoCount(rec) {
    var n = 0;
    ["serial"].concat(CHECKLIST.map(function (c) { return c.id; })).forEach(function (k) {
      if (rec.photos && rec.photos[k]) n++;
    });
    return n;
  }

  function putMachine(rec) {
    rec.updatedAt = Date.now();
    return ghPut(formPath(rec.id), rec, "QC: site " + (rec.siteNumber || "?")).then(function () {
      // update manifest (local + remote)
      if (!indexCache) indexCache = [];
      var entry = { id: rec.id, siteNumber: rec.siteNumber, serialLast6: rec.serialLast6, photoCount: photoCount(rec), updatedAt: rec.updatedAt };
      var i = indexCache.findIndex(function (e) { return e.id === rec.id; });
      if (i >= 0) indexCache[i] = entry; else indexCache.push(entry);
      return ghPut(INDEX_PATH, indexCache, "QC index update").then(function () { return rec; });
    });
  }
  function deleteMachine(id) {
    return ghDelete(formPath(id), "QC: delete " + id).then(function () {
      if (indexCache) indexCache = indexCache.filter(function (e) { return e.id !== id; });
      return ghPut(INDEX_PATH, indexCache || [], "QC index update");
    });
  }

  /* ---- Old on-device store (for one-time import only) ---- */
  function idbAllLegacy() {
    return new Promise(function (resolve) {
      try {
        var req = indexedDB.open("vmqc", 1);
        req.onupgradeneeded = function () { try { req.result.createObjectStore("machines", { keyPath: "id" }); } catch (e) {} };
        req.onsuccess = function () {
          try {
            var db = req.result;
            if (!db.objectStoreNames.contains("machines")) return resolve([]);
            var tx = db.transaction("machines", "readonly");
            var g = tx.objectStore("machines").getAll();
            g.onsuccess = function () { resolve(g.result || []); };
            g.onerror = function () { resolve([]); };
          } catch (e) { resolve([]); }
        };
        req.onerror = function () { resolve([]); };
      } catch (e) { resolve([]); }
    });
  }

  /* -------------------------------------------------------------
   * App state / navigation
   * ----------------------------------------------------------- */
  var view = "home";
  var current = null;
  var idx = 0;
  var CHECK_START = 2;
  var REVIEW_INDEX = CHECK_START + CHECKLIST.length;
  var TOTAL_STEPS = REVIEW_INDEX;

  var screen = document.getElementById("screen");
  var stepCount = document.getElementById("stepCount");
  var progressFill = document.getElementById("progressFill");
  var progressWrap = document.getElementById("progressWrap");
  var homeBtn = document.getElementById("homeBtn");
  var settingsBtn = document.getElementById("settingsBtn");
  var saveStatus = document.getElementById("saveStatus");

  homeBtn.addEventListener("click", function () { goHome(); });
  settingsBtn.addEventListener("click", function () { renderSettings(); });

  function el(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function isEmbedded() { try { return window.self !== window.top; } catch (e) { return true; } }
  function fmtDate(ms) { try { return new Date(ms).toLocaleDateString(); } catch (e) { return ""; } }
  function setStatus(msg, kind) { saveStatus.textContent = msg || ""; saveStatus.className = "save-status" + (kind ? " " + kind : ""); }

  function fileToPhoto(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, MAX_EDGE / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas"); canvas.width = cw; canvas.height = ch;
        canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
        try { cb({ dataURL: canvas.toDataURL("image/jpeg", 0.82), w: cw, h: ch }); }
        catch (e) { cb({ dataURL: reader.result, w: w, h: h }); }
      };
      img.onerror = function () { cb({ dataURL: reader.result, w: 0, h: 0 }); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  // Persist the current machine; report status in the header.
  function save() {
    if (!current) return Promise.resolve();
    if (!hasToken()) { setStatus("Not saved — add a GitHub token in ⚙ to save & share.", "err"); return Promise.reject(new Error("NO_TOKEN")); }
    setStatus("Saving…");
    return putMachine(current).then(function () { setStatus("Saved ✓", "ok"); }, function (e) {
      if (e && e.message === "NO_TOKEN") setStatus("Not saved — add a GitHub token in ⚙.", "err");
      else setStatus("Save failed — " + (e && e.message ? e.message : "check connection") + ". Tap to retry.", "err");
      throw e;
    });
  }

  function goHome() {
    view = "home"; current = null;
    homeBtn.style.display = "none"; progressWrap.style.display = "none"; setStatus("");
    history.replaceState(null, "", location.pathname);
    renderHome();
    window.scrollTo(0, 0);
  }
  function openMachine(rec, atIdx) {
    view = "machine"; current = rec; idx = atIdx || 0;
    homeBtn.style.display = ""; progressWrap.style.display = ""; setStatus("");
    renderMachine(); window.scrollTo(0, 0);
  }
  function go(n) { idx = n; renderMachine(); window.scrollTo(0, 0); }

  function setProgress() {
    if (idx >= REVIEW_INDEX) stepCount.textContent = "Review";
    else stepCount.textContent = "Step " + (idx + 1) + " of " + TOTAL_STEPS;
    progressFill.style.width = Math.min(100, Math.round((idx / REVIEW_INDEX) * 100)) + "%";
  }

  /* =============================================================
   * HOME
   * =========================================================== */
  function renderHome() {
    screen.innerHTML = "";
    screen.appendChild(el('<div class="spinner"></div>'));
    allMachines().then(function (rows) {
      renderHomeList(rows, null);
    }, function (err) {
      renderHomeList(null, err);
    });
  }

  function renderHomeList(rows, err) {
    screen.innerHTML = "";
    var wrap = el('<div></div>');

    if (!hasToken()) {
      var b = el('<div class="banner warn">View-only. <span class="as-link" id="addTok">Add a GitHub token</span> to create, edit, and save forms so others can see them.</div>');
      b.querySelector("#addTok").addEventListener("click", renderSettings);
      wrap.appendChild(b);
    }

    if (err) {
      var eb = el('<div class="banner err">Couldn’t load the shared forms (' + esc(err.message || "network error") + '). <span class="as-link" id="retry">Retry</span></div>');
      eb.querySelector("#retry").addEventListener("click", renderHome);
      wrap.appendChild(eb);
    }

    var count = rows ? rows.length : 0;
    wrap.appendChild(el('<div class="home-head"><h2>Machines</h2><span class="count">' + count + (count === 1 ? " machine" : " machines") + '</span></div>'));

    if (rows && rows.length) {
      var list = el('<div class="machine-list"></div>');
      rows.forEach(function (rec) {
        var n = rec.photoCount || 0;
        var pct = Math.round((n / TOTAL_SHOTS) * 100);
        var row = el(
          '<div class="machine">' +
            '<div class="open">' +
              '<div class="ring" style="--pct:' + pct + '%"><span>' + n + '/' + TOTAL_SHOTS + '</span></div>' +
              '<div class="meta"><div class="site">Site ' + esc(rec.siteNumber || "—") + '</div>' +
              '<div class="sub">SN …' + esc(rec.serialLast6 || "—") + ' · ' + fmtDate(rec.updatedAt) + '</div></div>' +
            '</div>' +
            '<button class="del" title="Delete">🗑</button>' +
          '</div>'
        );
        row.querySelector(".open").addEventListener("click", function () { openById(rec.id); });
        row.querySelector(".del").addEventListener("click", function (e) {
          e.stopPropagation();
          if (!hasToken()) { alert("Add a GitHub token in ⚙ to delete."); return; }
          if (!confirm("Delete Site " + (rec.siteNumber || "") + "? This removes it for everyone.")) return;
          setStatus("Deleting…");
          deleteMachine(rec.id).then(function () { setStatus(""); renderHome(); },
            function (er) { setStatus("Delete failed — " + (er.message || ""), "err"); });
        });
        list.appendChild(row);
      });
      wrap.appendChild(list);
    } else if (rows) {
      wrap.appendChild(el('<div class="empty">No machines yet.<br>Tap “New machine” to add the first one.</div>'));
    }

    var fab = el('<div class="fab-row"><button class="btn primary" id="newBtn">＋ New machine</button></div>');
    fab.querySelector("#newBtn").addEventListener("click", newMachine);
    wrap.appendChild(fab);

    screen.appendChild(wrap);
  }

  function openById(id) {
    setStatus("Opening…");
    getMachine(id).then(function (rec) {
      setStatus("");
      if (!rec) { alert("That machine wasn’t found."); return goHome(); }
      openMachine(rec, REVIEW_INDEX);
    }, function (e) { setStatus("Couldn’t open — " + (e.message || ""), "err"); });
  }

  function newMachine() {
    if (!hasToken()) { alert("Add a GitHub token in ⚙ first, so new machines can be saved and shared."); return renderSettings(); }
    var rec = {
      id: String(Date.now()) + "-" + Math.random().toString(36).slice(2, 7),
      siteNumber: "", serialLast6: "", photos: {}, createdAt: Date.now(), updatedAt: Date.now()
    };
    openMachine(rec, 0);
  }

  /* =============================================================
   * SETTINGS (token)
   * =========================================================== */
  function renderSettings() {
    view = "settings"; current = null;
    homeBtn.style.display = ""; progressWrap.style.display = "none"; setStatus("");
    screen.innerHTML = "";
    var card = el(
      '<div class="card">' +
        '<p class="step-label">Settings</p>' +
        '<h2 class="title">GitHub access</h2>' +
        '<p class="hint tight">Paste a GitHub token so this device can save forms to the shared repo. It is stored only in this browser and never uploaded into the repo.</p>' +
        '<label class="field" for="tok">GitHub token</label>' +
        '<input type="password" id="tok" placeholder="github_pat_…" autocomplete="off">' +
        '<div class="nav"><button class="btn ghost" id="clear">Clear</button><button class="btn primary" id="savetok">Save token</button></div>' +
        '<div class="help">How to create one (about a minute):' +
          '<ol>' +
            '<li>GitHub → <b>Settings → Developer settings → Personal access tokens → Fine-grained tokens</b>.</li>' +
            '<li><b>Generate new token</b>. Repository access → <b>Only select repositories</b> → <b>' + esc(GH.owner + "/" + GH.repo) + '</b>.</li>' +
            '<li>Permissions → Repository → <b>Contents: Read and write</b>. Generate, copy, paste above.</li>' +
          '</ol>' +
        '</div>' +
        '<div style="height:14px"></div>' +
        '<button class="btn ghost small" id="import" style="width:100%">⬆ Import machines saved on this device</button>' +
        '<p class="help" id="importNote">If you made machines before this shared version, this uploads them to the repo so everyone can see them.</p>' +
      '</div>'
    );
    var tok = card.querySelector("#tok");
    tok.value = getToken();
    card.querySelector("#savetok").addEventListener("click", function () {
      setToken(tok.value.trim());
      shaCache = {};
      alert(hasToken() ? "Token saved. You can now create and edit machines." : "Token cleared.");
      goHome();
    });
    card.querySelector("#clear").addEventListener("click", function () { setToken(""); tok.value = ""; alert("Token cleared."); });
    card.querySelector("#import").addEventListener("click", function () { importLegacy(card.querySelector("#importNote")); });
    screen.appendChild(card);
  }

  function importLegacy(noteEl) {
    if (!hasToken()) { alert("Add and save a token first."); return; }
    noteEl.textContent = "Looking for machines on this device…";
    idbAllLegacy().then(function (rows) {
      if (!rows.length) { noteEl.textContent = "No machines found on this device."; return; }
      if (!confirm("Upload " + rows.length + " machine(s) from this device to the shared repo?")) { noteEl.textContent = ""; return; }
      var i = 0;
      function next() {
        if (i >= rows.length) { noteEl.textContent = "Done — uploaded " + rows.length + " machine(s)."; indexCache = null; return; }
        var rec = rows[i++];
        noteEl.textContent = "Uploading " + i + " of " + rows.length + "…";
        putMachine(rec).then(next, function (e) { noteEl.textContent = "Upload failed on #" + i + " — " + (e.message || ""); });
      }
      next();
    });
  }

  /* =============================================================
   * MACHINE wizard
   * =========================================================== */
  function renderMachine() {
    setProgress();
    screen.innerHTML = "";
    if (idx <= 0) return renderSite();
    if (idx === 1) return renderSerial();
    if (idx >= CHECK_START && idx < REVIEW_INDEX) return renderChecklistItem(idx - CHECK_START);
    return renderReview();
  }

  function photoBlock(key, promptText) {
    var wrap = el(
      '<div class="capture"><div class="shot">' +
        '<div class="preview" id="prev-' + key + '">' + esc(promptText) + '</div>' +
        '<input type="file" accept="image/*" id="file-' + key + '">' +
        '<button class="btn ghost" type="button" id="take-' + key + '">📷 Add photo</button>' +
      '</div></div>'
    );
    var input = wrap.querySelector("#file-" + key);
    var prev = wrap.querySelector("#prev-" + key);
    var btn = wrap.querySelector("#take-" + key);
    function paint() {
      if (current.photos[key]) {
        prev.classList.add("filled");
        prev.innerHTML = '<img alt="" src="' + current.photos[key].dataURL + '">';
        btn.textContent = "🔄 Replace photo";
      }
    }
    paint();
    btn.addEventListener("click", function () { input.click(); });
    input.addEventListener("change", function () {
      var f = input.files && input.files[0];
      if (!f) return;
      prev.classList.remove("filled"); prev.textContent = "Processing…";
      fileToPhoto(f, function (photo) { current.photos[key] = photo; paint(); save().catch(function () {}); });
    });
    return wrap;
  }

  function renderSite() {
    var card = el(
      '<div class="card">' +
        '<p class="step-label">Start</p>' +
        '<h2 class="title big">Site number</h2>' +
        '<p class="hint">Enter the site number for this machine — this is the key identifier.</p>' +
        '<label class="field" for="site">Site number</label>' +
        '<input type="text" id="site" class="hero" placeholder="e.g. 82" autocomplete="off">' +
        '<div class="nav"><button class="btn primary" id="next">Next</button></div>' +
      '</div>'
    );
    var site = card.querySelector("#site"), next = card.querySelector("#next");
    site.value = current.siteNumber;
    site.addEventListener("input", function () { current.siteNumber = site.value; });
    next.addEventListener("click", function () {
      current.siteNumber = site.value.trim();
      if (!current.siteNumber) { site.focus(); return; }
      save().catch(function () {}); go(1);
    });
    screen.appendChild(card); site.focus();
  }

  function renderSerial() {
    var card = el(
      '<div class="card">' +
        '<p class="step-label">Serial</p>' +
        '<h2 class="title">Serial number</h2>' +
        '<p class="hint">Photograph the full serial number, then type the last 6 characters as a quick reference.</p>' +
        '<label class="field">Photo of full serial number</label>' +
      '</div>'
    );
    card.appendChild(photoBlock("serial", "No photo yet"));
    var last6wrap = el(
      '<div style="margin-top:16px">' +
        '<label class="field" for="last6">Last 6 of serial</label>' +
        '<input type="text" id="last6" class="mono" maxlength="6" placeholder="e.g. 5930v7" autocomplete="off" autocapitalize="characters">' +
        '<p class="error" id="err"></p></div>'
    );
    card.appendChild(last6wrap);
    var nav = el('<div class="nav"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next">Next</button></div>');
    card.appendChild(nav);
    var last6 = card.querySelector("#last6"), err = card.querySelector("#err");
    last6.value = current.serialLast6;
    last6.addEventListener("input", function () { current.serialLast6 = last6.value; if (last6.value.trim()) err.textContent = ""; });
    nav.querySelector("#back").addEventListener("click", function () { current.serialLast6 = last6.value.trim(); save().catch(function () {}); go(0); });
    nav.querySelector("#next").addEventListener("click", function () {
      current.serialLast6 = last6.value.trim();
      if (!current.serialLast6) { err.textContent = "Enter the last 6 of the serial."; last6.focus(); return; }
      save().catch(function () {}); go(CHECK_START);
    });
    screen.appendChild(card);
  }

  function renderChecklistItem(itemIdx) {
    var item = CHECKLIST[itemIdx], stepNo = CHECK_START + itemIdx;
    var card = el(
      '<div class="card">' +
        '<p class="step-label">Photo ' + (itemIdx + 1) + ' of ' + CHECKLIST.length + '</p>' +
        '<h2 class="title">' + esc(item.label) + '</h2>' +
        '<p class="hint">Take a photo of the ' + esc(item.label) + '.</p>' +
      '</div>'
    );
    card.appendChild(photoBlock(item.id, "No photo yet"));
    var isLast = itemIdx === CHECKLIST.length - 1;
    var nav = el('<div class="nav"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next">' + (isLast ? "Review" : "Next") + '</button></div>');
    card.appendChild(nav);
    nav.querySelector("#back").addEventListener("click", function () { go(stepNo - 1); });
    nav.querySelector("#next").addEventListener("click", function () { go(stepNo + 1); });
    screen.appendChild(card);
  }

  function renderReview() {
    var lines =
      '<div class="summary-line primary"><span class="k">Site number</span><span class="v">' + esc(current.siteNumber || "—") + '</span></div>' +
      '<div class="summary-line"><span class="k">Serial (last 6)</span><span class="v mono">' + esc(current.serialLast6 || "—") + '</span></div>' +
      '<div class="summary-line"><span class="k">Date</span><span class="v">' + esc(new Date(current.updatedAt).toLocaleDateString()) + '</span></div>';
    var allShots = [{ id: "serial", label: "Full serial number" }].concat(CHECKLIST);
    var tiles = "";
    allShots.forEach(function (s) {
      var has = !!current.photos[s.id];
      tiles +=
        '<div class="tile" data-goto="' + s.id + '">' +
          '<div class="thumb">' + (has ? '<img alt="" src="' + current.photos[s.id].dataURL + '">' : 'No photo') + '</div>' +
          '<div class="cap"><span>' + esc(s.label) + '</span><span class="badge ' + (has ? "have" : "missing") + '">' + (has ? "✓" : "missing") + '</span></div>' +
        '</div>';
    });
    var missing = allShots.filter(function (s) { return !current.photos[s.id]; }).length;
    var card = el(
      '<div class="card">' +
        '<p class="step-label">Review</p>' +
        '<h2 class="title">Review &amp; PDF</h2>' +
        '<p class="hint">Check everything below, then save the PDF or copy a share link.</p>' +
        lines +
        '<div class="grid">' + tiles + '</div>' +
        (missing ? '<p class="error" style="margin-top:14px">' + missing + ' photo(s) still missing — tap a tile to add.</p>' : '') +
        '<div class="nav" style="margin-top:20px"><button class="btn ghost" id="back">Back</button><button class="btn ok" id="save">⬇️ Save PDF</button></div>' +
        '<div style="height:12px"></div>' +
        '<button class="btn ghost small" id="share" style="width:100%">🔗 Copy share link for this machine</button>' +
      '</div>'
    );
    card.querySelectorAll(".tile").forEach(function (tile) {
      tile.addEventListener("click", function () {
        var key = tile.getAttribute("data-goto");
        if (key === "serial") return go(1);
        var i = CHECKLIST.findIndex(function (c) { return c.id === key; });
        if (i >= 0) go(CHECK_START + i);
      });
    });
    card.querySelector("#back").addEventListener("click", function () { go(REVIEW_INDEX - 1); });
    card.querySelector("#save").addEventListener("click", savePdf);
    card.querySelector("#share").addEventListener("click", function () {
      var url = location.origin + location.pathname + "?id=" + encodeURIComponent(current.id);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { setStatus("Share link copied ✓", "ok"); }, function () { prompt("Copy this link:", url); });
      } else { prompt("Copy this link:", url); }
    });
    if (isEmbedded()) card.querySelector(".nav").insertAdjacentElement("afterend",
      el('<p class="hint" style="margin-top:12px;text-align:center">Hosted preview — to save the PDF, open the app’s real link.</p>'));
    screen.appendChild(card);
  }

  /* =============================================================
   * PDF (unchanged builder) + iOS-friendly save
   * =========================================================== */
  var PAGE_W = 612, PAGE_H = 792, MARGIN = 54;
  function strToBytes(str) { var o = new Uint8Array(str.length); for (var i = 0; i < str.length; i++) o[i] = str.charCodeAt(i) & 0xff; return o; }
  function base64ToBytes(b64) { var b = atob(b64); var o = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; }
  function dataUrlToJpegBytes(dataURL) { return base64ToBytes(dataURL.substring(dataURL.indexOf(",") + 1)); }
  function pdfText(s) { return String(s == null ? "" : s).replace(/[\\()]/g, function (c) { return "\\" + c; }).replace(/[^\x20-\x7e]/g, ""); }
  function concat(arrays) {
    var total = 0, i; for (i = 0; i < arrays.length; i++) total += arrays[i].length;
    var out = new Uint8Array(total), off = 0;
    for (i = 0; i < arrays.length; i++) { out.set(arrays[i], off); off += arrays[i].length; }
    return out;
  }
  function orderedShots() {
    return [{ id: "serial", label: "Full serial number" }].concat(CHECKLIST)
      .filter(function (s) { return current.photos[s.id]; })
      .map(function (s) { return { label: s.label, photo: current.photos[s.id] }; });
  }
  function buildPdf() {
    var shots = orderedShots();
    var objects = []; function addObj(b) { objects.push(b); return objects.length; }
    var catalogNo = 1, pagesNo = 2, fontNo = 3; objects.length = 3;
    var kids = [];
    var now = new Date();
    var coverLines = [
      { size: 30, text: "Site " + pdfText(current.siteNumber) },
      { size: 14, gap: 34, text: "Vending Machine QC Report" },
      { size: 13, gap: 40, text: "Serial (last 6): " + pdfText(current.serialLast6) },
      { size: 13, gap: 22, text: "Date: " + pdfText(now.toLocaleString()) },
      { size: 13, gap: 22, text: "Photos: " + shots.length }
    ];
    var cy = PAGE_H - MARGIN - 30, coverStream = "";
    coverLines.forEach(function (ln) { cy -= (ln.gap || 0); coverStream += "BT /F1 " + ln.size + " Tf 1 0 0 1 " + MARGIN + " " + cy + " Tm (" + ln.text + ") Tj ET\n"; });
    coverStream += "0.85 0.85 0.85 RG 1 w " + MARGIN + " " + (PAGE_H - MARGIN - 46) + " m " + (PAGE_W - MARGIN) + " " + (PAGE_H - MARGIN - 46) + " l S\n";
    kids.push(addObj(pageObj(addObj(streamObj(coverStream)), null)));
    shots.forEach(function (shot) {
      var imgNo = addObj(imageObj(shot.photo));
      var capY = PAGE_H - MARGIN;
      var stream = "BT /F1 15 Tf 1 0 0 1 " + MARGIN + " " + (capY - 4) + " Tm (" + pdfText(shot.label) + ") Tj ET\n";
      var availW = PAGE_W - 2 * MARGIN, availH = (capY - 24) - MARGIN;
      var iw = shot.photo.w || 1, ih = shot.photo.h || 1;
      var scale = Math.min(availW / iw, availH / ih), dw = iw * scale, dh = ih * scale;
      var dx = MARGIN + (availW - dw) / 2, dy = MARGIN + (availH - dh) / 2;
      stream += "q " + dw.toFixed(2) + " 0 0 " + dh.toFixed(2) + " " + dx.toFixed(2) + " " + dy.toFixed(2) + " cm /Im0 Do Q\n";
      kids.push(addObj(pageObj(addObj(streamObj(stream)), imgNo)));
    });
    objects[catalogNo - 1] = strToBytes("<< /Type /Catalog /Pages " + pagesNo + " 0 R >>");
    objects[pagesNo - 1] = strToBytes("<< /Type /Pages /Count " + kids.length + " /Kids [" + kids.map(function (n) { return n + " 0 R"; }).join(" ") + "] >>");
    objects[fontNo - 1] = strToBytes("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
    return assemble(objects, catalogNo);
    function streamObj(content) { return concat([strToBytes("<< /Length " + content.length + " >>\nstream\n"), strToBytes(content), strToBytes("\nendstream")]); }
    function pageObj(contentNo, imgNo) {
      var res = "/Font << /F1 " + fontNo + " 0 R >>";
      if (imgNo) res += " /XObject << /Im0 " + imgNo + " 0 R >>";
      return strToBytes("<< /Type /Page /Parent " + pagesNo + " 0 R /MediaBox [0 0 " + PAGE_W + " " + PAGE_H + "] /Resources << " + res + " >> /Contents " + contentNo + " 0 R >>");
    }
    function imageObj(photo) {
      var jpeg = dataUrlToJpegBytes(photo.dataURL);
      return concat([strToBytes("<< /Type /XObject /Subtype /Image /Width " + (photo.w || 1) + " /Height " + (photo.h || 1) + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpeg.length + " >>\nstream\n"), jpeg, strToBytes("\nendstream")]);
    }
  }
  function assemble(objects, rootNo) {
    var chunks = [], offsets = new Array(objects.length + 1), pos = 0;
    function push(b) { chunks.push(b); pos += b.length; }
    push(strToBytes("%PDF-1.4\n%\xe2\xe3\xcf\xd3\n"));
    for (var i = 0; i < objects.length; i++) { offsets[i + 1] = pos; push(strToBytes((i + 1) + " 0 obj\n")); push(objects[i]); push(strToBytes("\nendobj\n")); }
    var xrefStart = pos, n = objects.length + 1;
    var xref = "xref\n0 " + n + "\n0000000000 65535 f \n";
    for (var j = 1; j < n; j++) xref += ("0000000000" + offsets[j]).slice(-10) + " 00000 n \n";
    push(strToBytes(xref));
    push(strToBytes("trailer\n<< /Size " + n + " /Root " + rootNo + " 0 R >>\nstartxref\n" + xrefStart + "\n%%EOF"));
    return concat(chunks);
  }
  function sanitizeName(s) { return String(s || "").replace(/[^A-Za-z0-9_-]+/g, "_").replace(/^_+|_+$/g, "") || "machine"; }
  function pdfFilename() { return "QC_Site-" + sanitizeName(current.siteNumber) + "_" + sanitizeName(current.serialLast6) + ".pdf"; }
  function buildPrintReport() {
    var report = document.getElementById("report");
    var allShots = [{ id: "serial", label: "Full serial number" }].concat(CHECKLIST);
    var photosHtml = allShots.map(function (s) {
      var inner = current.photos[s.id] ? '<img alt="" src="' + current.photos[s.id].dataURL + '">' : '<span class="none">No photo captured</span>';
      return '<section class="rpt-photo"><h2>' + esc(s.label) + '</h2><div class="frame">' + inner + '</div></section>';
    }).join("");
    report.innerHTML =
      '<div class="rpt-header"><h1>Vending Machine QC Report</h1><div class="rpt-meta">' +
        '<div><span class="k">Site</span><br><span class="v">' + esc(current.siteNumber || "—") + '</span></div>' +
        '<div><span class="k">Serial (last 6)</span><br><span class="v">' + esc(current.serialLast6 || "—") + '</span></div>' +
        '<div><span class="k">Date</span><br><span class="v">' + esc(new Date().toLocaleString()) + '</span></div>' +
        '<div><span class="k">Photos</span><br><span class="v">' + photoCount(current) + ' of ' + TOTAL_SHOTS + '</span></div>' +
      '</div></div>' + photosHtml;
  }
  function savePdf() {
    var bytes, blob, file;
    try {
      bytes = buildPdf(); blob = new Blob([bytes], { type: "application/pdf" });
      file = new File([blob], pdfFilename(), { type: "application/pdf" });
    } catch (e) { alert("Sorry — could not build the PDF: " + e.message); return; }
    if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
      navigator.share({ files: [file], title: pdfFilename() }).catch(function (e) { if (e && e.name === "AbortError") return; printFallback(); });
      return;
    }
    if (!isiOS() && ("download" in document.createElement("a"))) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a"); a.href = url; a.download = pdfFilename();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return;
    }
    printFallback();
  }
  function printFallback() { buildPrintReport(); setTimeout(function () { window.print(); }, 60); }
  function isiOS() { return /iP(hone|ad|od)/.test(navigator.platform) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent)); }

  window.__qc = { buildPdf: function () { return buildPdf(); }, get current() { return current; } };

  /* -------------------------------------------------------------
   * Boot
   * ----------------------------------------------------------- */
  function boot() {
    var deepId = null;
    try { deepId = new URLSearchParams(location.search).get("id"); } catch (e) {}
    screen.innerHTML = ""; screen.appendChild(el('<div class="spinner"></div>'));
    loadIndex().then(function () {
      if (deepId) openById(deepId); else goHome();
    }, function (err) {
      renderHomeList(null, err);
    });
  }
  boot();
})();
</script>
