<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Vending Machine QC</title>
<style>
  /* ---- Palette (explicit light theme; this is a standalone app page) ---- */
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --brand: #2563eb;
    --brand-ink: #ffffff;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 1px 2px rgba(15, 23, 42, .06);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  /* ---- App shell ---- */
  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header.bar { padding: 16px 18px 12px; }
  .bar-row { display: flex; align-items: center; gap: 12px; }
  header.bar h1 { font-size: 17px; margin: 0; letter-spacing: .2px; flex: 1; }
  .link-btn {
    -webkit-appearance: none; appearance: none; background: none; border: none;
    color: var(--brand); font-size: 15px; font-weight: 600; cursor: pointer; padding: 6px 4px;
  }
  .progress {
    margin-top: 10px;
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 13px;
  }
  .progress .track { flex: 1; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .progress .fill { height: 100%; width: 0%; background: var(--brand); border-radius: 999px; transition: width .25s ease; }

  main { flex: 1; padding: 6px 18px 18px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 20px;
  }

  .step-label {
    font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px;
    color: var(--brand); margin: 0 0 4px;
  }
  h2.title { margin: 0 0 4px; font-size: 22px; }
  h2.title.big { font-size: 26px; }
  p.hint { margin: 0 0 18px; color: var(--muted); font-size: 14px; }

  label.field { display: block; font-size: 14px; font-weight: 600; margin: 0 0 6px; }
  input[type="text"] {
    width: 100%; font-size: 18px; padding: 14px 14px;
    border: 1.5px solid var(--line); border-radius: 12px;
    background: #fff; color: var(--ink); outline: none;
  }
  input.hero { font-size: 24px; padding: 16px 16px; text-align: center; font-weight: 700; }
  input[type="text"]:focus { border-color: var(--brand); }
  .mono { font-variant-ligatures: none; letter-spacing: .5px; }

  .error { color: var(--danger); font-size: 13px; margin: 8px 0 0; min-height: 16px; }

  /* ---- Photo capture ---- */
  .capture { margin-top: 6px; }
  .capture input[type="file"] { display: none; }
  .shot { display: flex; flex-direction: column; gap: 12px; }
  .shot-btns { display: flex; gap: 10px; }
  .shot-btns .btn { flex: 1; }
  .preview {
    width: 100%; aspect-ratio: 4 / 3; border-radius: 14px;
    border: 1.5px dashed var(--line); background: #f8fafc;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); overflow: hidden; text-align: center; padding: 12px; font-size: 14px;
  }
  .preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .preview.filled { border-style: solid; border-color: var(--ok); }

  /* ---- Buttons ---- */
  .btn {
    -webkit-appearance: none; appearance: none; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; padding: 15px 18px; cursor: pointer; width: 100%; text-align: center;
  }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); }
  .btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn.small { width: auto; padding: 11px 16px; font-size: 14px; }

  .nav { display: flex; gap: 12px; margin-top: 18px; }
  .nav .btn { flex: 1; }

  /* ---- Home / machine list ---- */
  .home-head { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 14px; }
  .home-head h2 { margin: 0; font-size: 22px; }
  .home-head .count { color: var(--muted); font-size: 14px; }
  .machine-list { display: flex; flex-direction: column; gap: 12px; }
  .machine {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 14px 14px;
  }
  .machine .open { flex: 1; display: flex; align-items: center; gap: 14px; cursor: pointer; min-width: 0; }
  .machine .ring {
    flex: none; width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--brand);
    background: conic-gradient(var(--brand) var(--pct,0%), var(--line) 0);
  }
  .machine .ring span { width: 38px; height: 38px; border-radius: 50%; background: var(--card);
    display: flex; align-items: center; justify-content: center; }
  .machine .meta { min-width: 0; }
  .machine .site { font-size: 18px; font-weight: 700; }
  .machine .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .machine .del {
    -webkit-appearance: none; appearance: none; background: none; border: none;
    color: var(--muted); font-size: 20px; cursor: pointer; padding: 8px; flex: none; line-height: 1;
  }
  .machine .del:hover { color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .fab-row { margin-top: 16px; }

  /* ---- Review list ---- */
  .summary-line {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px;
  }
  .summary-line .k { color: var(--muted); }
  .summary-line .v { font-weight: 600; text-align: right; }
  .summary-line.primary .v { font-size: 18px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
  .tile { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
  .tile .thumb {
    aspect-ratio: 4 / 3; background: #f1f5f9;
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px;
  }
  .tile .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .tile .cap { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; font-size: 13px; font-weight: 600; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .badge.have { background: var(--ok-bg); color: var(--ok); }
  .badge.missing { background: var(--danger-bg); color: var(--danger); }

  /* ---- Print report (hidden on screen) ---- */
  #report { display: none; }
  @media print {
    @page { margin: 12mm; }
    body { background: #fff; }
    .app { display: none !important; }
    #report { display: block !important; }
    .rpt-header { margin-bottom: 8mm; border-bottom: 2px solid #0f172a; padding-bottom: 5mm; }
    .rpt-header h1 { margin: 0 0 4mm; font-size: 22px; }
    .rpt-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 8mm; font-size: 13px; }
    .rpt-meta .k { color: #475569; }
    .rpt-meta .v { font-weight: 700; }
    .rpt-photo { page-break-inside: avoid; break-inside: avoid; page-break-before: always; }
    .rpt-photo h2 { font-size: 16px; margin: 0 0 3mm; }
    .rpt-photo .frame { width: 100%; height: 220mm; display: flex; align-items: center; justify-content: center; border: 1px solid #cbd5e1; }
    .rpt-photo img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .rpt-photo .none { color: #dc2626; font-weight: 700; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="bar">
    <div class="bar-row">
      <button class="link-btn" id="homeBtn" style="display:none">‹ Machines</button>
      <h1>Vending Machine QC</h1>
    </div>
    <div class="progress" id="progressWrap" style="display:none">
      <span id="stepCount">Start</span>
      <span class="track"><span class="fill" id="progressFill"></span></span>
    </div>
  </header>
  <main id="screen"><!-- rendered by JS --></main>
</div>

<div id="report"></div>

<script>
(function () {
  "use strict";

  /* -------------------------------------------------------------
   * Checklist configuration — edit / reorder / add items here.
   * Each item is one photo capture in the wizard.
   * ----------------------------------------------------------- */
  var CHECKLIST = [
    { id: "peplink",    label: "Peplink" },
    { id: "optconnect", label: "OptConnect" },
    { id: "nuc",        label: "Nuc" },
    { id: "badge",      label: "Badge" },
    { id: "inside",     label: "Inside" },
    { id: "outside",    label: "Outside" },
    { id: "keys",       label: "Keys" },
    { id: "crate",      label: "Crate with label" }
  ];

  var MAX_EDGE = 1600;              // downscale longest photo edge
  var TOTAL_SHOTS = 1 + CHECKLIST.length; // serial photo + checklist items

  /* =============================================================
   * Storage — shared Supabase backend. These QCs are the "final
   * checklist": stored as builds(kind='final') + build_steps, with
   * photos in the 'photos' bucket under final/<id>/<key>.jpg. They
   * show up in review.html under the "Final checklist" filter.
   * Record shape (kept the same as before, plus photo.path):
   *   { id, siteNumber, serialLast6, status,
   *     photos: { key -> {dataURL,w,h,path} }, createdAt, updatedAt }
   * =========================================================== */
  var SUPABASE_URL = "https://wpniecetoljhdrrljcta.supabase.co";
  var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwbmllY2V0b2xqaGRycmxqY3RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzA0ODgsImV4cCI6MjEwNTAwNjQ4OH0.m9jJlwy_EysIPAJMLdEcETFtaz2WdJop0Q1lhUElFnU";

  function sbH(extra) { return Object.assign({ apikey: SUPABASE_ANON, Authorization: "Bearer " + SUPABASE_ANON }, extra || {}); }
  function sbRest(path, opts) {
    return fetch(SUPABASE_URL + "/rest/v1/" + path, opts).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error("DB " + r.status + " " + t.slice(0, 140)); });
      return r.status === 204 ? null : r.json();
    });
  }
  function publicUrl(key) { return SUPABASE_URL + "/storage/v1/object/public/photos/" + key; }
  function storageUpload(path, blob) {
    return fetch(SUPABASE_URL + "/storage/v1/object/photos/" + path, {
      method: "POST", headers: sbH({ "Content-Type": blob.type || "image/jpeg", "x-upsert": "true" }), body: blob
    }).then(function (r) { if (!r.ok) return r.text().then(function (t) { throw new Error("Upload " + r.status + " " + t.slice(0, 120)); }); return true; });
  }

  var STEP_LABELS = { serial: "Full serial number" };
  CHECKLIST.forEach(function (c) { STEP_LABELS[c.id] = c.label; });

  function recFromRow(b, steps) {
    var photos = {};
    (steps || []).forEach(function (s) { if (s.photo_path) photos[s.step_id] = { path: s.photo_path, dataURL: publicUrl(s.photo_path), w: 0, h: 0 }; });
    return {
      id: b.id, siteNumber: b.site_number || "", serialLast6: b.serial_last6 || "", status: b.status,
      photos: photos, createdAt: b.created_at ? Date.parse(b.created_at) : Date.now(),
      updatedAt: b.updated_at ? Date.parse(b.updated_at) : Date.now()
    };
  }
  function allMachines() {
    return sbRest("builds?kind=eq.final&select=id,site_number,serial_last6,status,created_at,updated_at,build_steps(step_id,photo_path)&order=updated_at.desc", { headers: sbH() })
      .then(function (rows) { return (rows || []).map(function (b) { return recFromRow(b, b.build_steps); }); });
  }
  function getMachine(id) {
    return Promise.all([
      sbRest("builds?id=eq." + id + "&select=id,site_number,serial_last6,status,created_at,updated_at", { headers: sbH() }),
      sbRest("build_steps?build_id=eq." + id + "&select=step_id,photo_path", { headers: sbH() })
    ]).then(function (res) { var b = res[0] && res[0][0]; return b ? recFromRow(b, res[1]) : null; });
  }
  function createMachine() {
    return sbRest("builds", { method: "POST", headers: sbH({ "Content-Type": "application/json", Prefer: "return=representation" }),
      body: JSON.stringify({ kind: "final", status: "in_progress" }) }).then(function (rows) { return recFromRow(rows[0], []); });
  }
  function putMachine(rec) {
    if (!rec.id) return Promise.resolve(rec);
    return sbRest("builds?id=eq." + rec.id, { method: "PATCH", headers: sbH({ "Content-Type": "application/json" }),
      body: JSON.stringify({ site_number: rec.siteNumber || null, serial_last6: rec.serialLast6 || null, updated_at: new Date().toISOString() }) })
      .then(function () { rec.updatedAt = Date.now(); return rec; });
  }
  function deleteMachine(id) { return sbRest("builds?id=eq." + id, { method: "DELETE", headers: sbH() }); }
  function submitMachine(id) {
    return sbRest("builds?id=eq." + id, { method: "PATCH", headers: sbH({ "Content-Type": "application/json" }),
      body: JSON.stringify({ status: "submitted", updated_at: new Date().toISOString() }) });
  }
  // Upload one captured photo and record its build_step.
  function uploadPhoto(rec, key, blob) {
    var path = "final/" + rec.id + "/" + key + ".jpg";
    return storageUpload(path, blob).then(function () {
      return sbRest("build_steps?on_conflict=build_id,step_id", { method: "POST",
        headers: sbH({ "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=representation" }),
        body: JSON.stringify({ build_id: rec.id, step_id: key, label: STEP_LABELS[key] || key, photo_path: path, updated_at: new Date().toISOString() }) });
    }).then(function () { return path; });
  }
  function dataURLToBlob(dataURL) {
    var parts = dataURL.split(","), mime = (parts[0].match(/:(.*?);/) || [])[1] || "image/jpeg";
    var bin = atob(parts[1]), n = bin.length, u8 = new Uint8Array(n);
    for (var i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
    return new Blob([u8], { type: mime });
  }

  /* -------------------------------------------------------------
   * App state
   * ----------------------------------------------------------- */
  var view = "home";       // "home" | "machine"
  var current = null;      // the machine record being edited
  var idx = 0;             // wizard screen index within a machine

  // Wizard indices: 0 = site number, 1 = serial, 2..(2+N-1) = checklist, REVIEW_INDEX = review
  var CHECK_START = 2;
  var REVIEW_INDEX = CHECK_START + CHECKLIST.length;
  var TOTAL_STEPS = REVIEW_INDEX;

  var screen = document.getElementById("screen");
  var stepCount = document.getElementById("stepCount");
  var progressFill = document.getElementById("progressFill");
  var progressWrap = document.getElementById("progressWrap");
  var homeBtn = document.getElementById("homeBtn");

  homeBtn.addEventListener("click", function () { goHome(); });

  /* -------------------------------------------------------------
   * Helpers
   * ----------------------------------------------------------- */
  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function isEmbedded() { try { return window.self !== window.top; } catch (e) { return true; } }
  function photoCount(rec) {
    var n = 0;
    ["serial"].concat(CHECKLIST.map(function (c) { return c.id; })).forEach(function (k) {
      if (rec.photos && rec.photos[k]) n++;
    });
    return n;
  }
  function fmtDate(ms) { try { return new Date(ms).toLocaleDateString(); } catch (e) { return ""; } }

  // Read a File, downscale via canvas, return { dataURL, w, h } (JPEG).
  function fileToPhoto(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, MAX_EDGE / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
        try { cb({ dataURL: canvas.toDataURL("image/jpeg", 0.82), w: cw, h: ch }); }
        catch (e) { cb({ dataURL: reader.result, w: w, h: h }); }
      };
      img.onerror = function () { cb({ dataURL: reader.result, w: 0, h: 0 }); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function save() { if (current) return putMachine(current); return Promise.resolve(); }

  /* -------------------------------------------------------------
   * Navigation
   * ----------------------------------------------------------- */
  function goHome() {
    view = "home";
    current = null;
    homeBtn.style.display = "none";
    progressWrap.style.display = "none";
    renderHome();
    window.scrollTo(0, 0);
  }
  function openMachine(rec, atIdx) {
    view = "machine";
    current = rec;
    idx = atIdx || 0;
    homeBtn.style.display = "";
    progressWrap.style.display = "";
    renderMachine();
    window.scrollTo(0, 0);
  }
  function go(n) { idx = n; renderMachine(); window.scrollTo(0, 0); }

  function setProgress() {
    if (idx >= REVIEW_INDEX) stepCount.textContent = "Review";
    else stepCount.textContent = "Step " + (idx + 1) + " of " + TOTAL_STEPS;
    var pct = Math.min(100, Math.round(((idx) / REVIEW_INDEX) * 100));
    progressFill.style.width = pct + "%";
  }

  /* =============================================================
   * HOME screen
   * =========================================================== */
  function renderHome() {
    screen.innerHTML = "";
    var wrap = el('<div></div>');
    allMachines().then(function (rows) {
      var head = el(
        '<div class="home-head"><h2>Machines</h2>' +
        '<span class="count">' + rows.length + (rows.length === 1 ? " machine" : " machines") + '</span></div>'
      );
      wrap.appendChild(head);

      if (!rows.length) {
        wrap.appendChild(el('<div class="empty">No machines yet.<br>Tap “New machine” to start your first QC.</div>'));
      } else {
        var list = el('<div class="machine-list"></div>');
        rows.forEach(function (rec) {
          var n = photoCount(rec);
          var pct = Math.round((n / TOTAL_SHOTS) * 100);
          var row = el(
            '<div class="machine">' +
              '<div class="open">' +
                '<div class="ring" style="--pct:' + pct + '%"><span>' + n + '/' + TOTAL_SHOTS + '</span></div>' +
                '<div class="meta">' +
                  '<div class="site">Site ' + esc(rec.siteNumber || "—") + '</div>' +
                  '<div class="sub">SN …' + esc(rec.serialLast6 || "—") + ' · ' + fmtDate(rec.updatedAt) + '</div>' +
                '</div>' +
              '</div>' +
              '<button class="del" title="Delete">🗑</button>' +
            '</div>'
          );
          row.querySelector(".open").addEventListener("click", function () {
            openMachine(rec, REVIEW_INDEX); // open at review; they can jump to any step
          });
          row.querySelector(".del").addEventListener("click", function (e) {
            e.stopPropagation();
            if (!confirm("Delete Site " + (rec.siteNumber || "") + "? This can't be undone.")) return;
            deleteMachine(rec.id).then(renderHome);
          });
          list.appendChild(row);
        });
        wrap.appendChild(list);
      }

      var fab = el('<div class="fab-row"><button class="btn primary" id="newBtn">＋ New machine</button></div>');
      fab.querySelector("#newBtn").addEventListener("click", newMachine);
      wrap.appendChild(fab);
    }, function (err) {
      wrap.innerHTML = "";
      var eb = el('<div class="empty">Couldn’t reach the server (' + esc(err.message || "network") + ').<br><button class="btn ghost small" id="retry" style="margin-top:12px">Retry</button></div>');
      eb.querySelector("#retry").addEventListener("click", renderHome);
      wrap.appendChild(eb);
      var fab = el('<div class="fab-row"><button class="btn primary" id="newBtn">＋ New machine</button></div>');
      fab.querySelector("#newBtn").addEventListener("click", newMachine);
      wrap.appendChild(fab);
    });
    screen.appendChild(wrap);
  }

  function newMachine() {
    screen.innerHTML = ""; screen.appendChild(el('<div class="empty">Creating…</div>'));
    createMachine().then(function (rec) { openMachine(rec, 0); },
      function (e) { alert("Couldn’t start a new QC — " + (e.message || "check your connection")); goHome(); });
  }

  /* =============================================================
   * MACHINE wizard
   * =========================================================== */
  function renderMachine() {
    setProgress();
    screen.innerHTML = "";
    if (idx <= 0) return renderSite();
    if (idx === 1) return renderSerial();
    if (idx >= CHECK_START && idx < REVIEW_INDEX) return renderChecklistItem(idx - CHECK_START);
    return renderReview();
  }

  function photoBlock(key, promptText) {
    var wrap = el(
      '<div class="capture">' +
        '<div class="shot">' +
          '<div class="preview" id="prev-' + key + '">' + esc(promptText) + '</div>' +
          '<input type="file" accept="image/*" capture="environment" id="cam-' + key + '">' +
          '<input type="file" accept="image/*" id="lib-' + key + '">' +
          '<div class="shot-btns">' +
            '<button class="btn ghost" type="button" id="take-' + key + '">📷 Take photo</button>' +
            '<button class="btn ghost" type="button" id="pick-' + key + '">🖼️ From library</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
    var cam = wrap.querySelector("#cam-" + key);
    var lib = wrap.querySelector("#lib-" + key);
    var prev = wrap.querySelector("#prev-" + key);
    var takeBtn = wrap.querySelector("#take-" + key);
    var pickBtn = wrap.querySelector("#pick-" + key);
    function paint() {
      if (current.photos[key]) {
        prev.classList.add("filled");
        prev.innerHTML = '<img alt="" src="' + current.photos[key].dataURL + '">';
        takeBtn.textContent = "🔄 Retake";
      }
    }
    paint();
    function handle(inp) {
      var f = inp.files && inp.files[0];
      if (!f) return;
      prev.classList.remove("filled");
      prev.textContent = "Processing…";
      fileToPhoto(f, function (photo) {
        current.photos[key] = photo; paint();
        if (current.id) {
          uploadPhoto(current, key, dataURLToBlob(photo.dataURL)).then(function (path) {
            current.photos[key].path = path;
          }, function (e) { alert("Photo didn’t upload — " + (e.message || "check your connection") + ". Try again."); });
        }
      });
      inp.value = "";
    }
    takeBtn.addEventListener("click", function () { cam.click(); });
    pickBtn.addEventListener("click", function () { lib.click(); });
    cam.addEventListener("change", function () { handle(cam); });
    lib.addEventListener("change", function () { handle(lib); });
    return wrap;
  }

  function renderSite() {
    var card = el(
      '<div class="card">' +
        '<p class="step-label">Start</p>' +
        '<h2 class="title big">Site number</h2>' +
        '<p class="hint">Enter the site number for this machine — this is the key identifier.</p>' +
        '<label class="field" for="site">Site number</label>' +
        '<input type="text" id="site" class="hero" placeholder="e.g. 82" autocomplete="off">' +
        '<div class="nav"><button class="btn primary" id="next">Next</button></div>' +
      '</div>'
    );
    var site = card.querySelector("#site");
    var next = card.querySelector("#next");
    site.value = current.siteNumber;
    site.addEventListener("input", function () { current.siteNumber = site.value; });
    next.addEventListener("click", function () {
      current.siteNumber = site.value.trim();
      if (!current.siteNumber) { site.focus(); return; }
      save(); go(1);
    });
    screen.appendChild(card);
    site.focus();
  }

  function renderSerial() {
    var card = el(
      '<div class="card">' +
        '<p class="step-label">Serial</p>' +
        '<h2 class="title">Serial number</h2>' +
        '<p class="hint">Photograph the full serial number, then type the last 6 characters as a quick reference.</p>' +
        '<label class="field">Photo of full serial number</label>' +
      '</div>'
    );
    card.appendChild(photoBlock("serial", "No photo yet"));
    var last6wrap = el(
      '<div style="margin-top:16px">' +
        '<label class="field" for="last6">Last 6 of serial</label>' +
        '<input type="text" id="last6" class="mono" maxlength="6" placeholder="e.g. 5930v7" autocomplete="off" autocapitalize="characters">' +
        '<p class="error" id="err"></p>' +
      '</div>'
    );
    card.appendChild(last6wrap);
    var nav = el('<div class="nav"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next">Next</button></div>');
    card.appendChild(nav);

    var last6 = card.querySelector("#last6");
    var err = card.querySelector("#err");
    last6.value = current.serialLast6;
    last6.addEventListener("input", function () {
      current.serialLast6 = last6.value;
      if (last6.value.trim()) err.textContent = "";
    });
    nav.querySelector("#back").addEventListener("click", function () { current.serialLast6 = last6.value.trim(); save(); go(0); });
    nav.querySelector("#next").addEventListener("click", function () {
      current.serialLast6 = last6.value.trim();
      if (!current.serialLast6) { err.textContent = "Enter the last 6 of the serial."; last6.focus(); return; }
      save(); go(CHECK_START);
    });
    screen.appendChild(card);
  }

  function renderChecklistItem(itemIdx) {
    var item = CHECKLIST[itemIdx];
    var stepNo = CHECK_START + itemIdx;
    var card = el(
      '<div class="card">' +
        '<p class="step-label">Photo ' + (itemIdx + 1) + ' of ' + CHECKLIST.length + '</p>' +
        '<h2 class="title">' + esc(item.label) + '</h2>' +
        '<p class="hint">Take a photo of the ' + esc(item.label) + '.</p>' +
      '</div>'
    );
    card.appendChild(photoBlock(item.id, "No photo yet"));
    var isLast = itemIdx === CHECKLIST.length - 1;
    var nav = el('<div class="nav"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next">' + (isLast ? "Review" : "Next") + '</button></div>');
    card.appendChild(nav);
    nav.querySelector("#back").addEventListener("click", function () { go(stepNo - 1); });
    nav.querySelector("#next").addEventListener("click", function () { go(stepNo + 1); });
    screen.appendChild(card);
  }

  function renderReview() {
    var lines =
      '<div class="summary-line primary"><span class="k">Site number</span><span class="v">' + esc(current.siteNumber || "—") + '</span></div>' +
      '<div class="summary-line"><span class="k">Serial (last 6)</span><span class="v mono">' + esc(current.serialLast6 || "—") + '</span></div>' +
      '<div class="summary-line"><span class="k">Date</span><span class="v">' + esc(new Date(current.updatedAt).toLocaleDateString()) + '</span></div>';

    var allShots = [{ id: "serial", label: "Full serial number" }].concat(CHECKLIST);
    var tiles = "";
    allShots.forEach(function (s) {
      var has = !!current.photos[s.id];
      tiles +=
        '<div class="tile" data-goto="' + s.id + '">' +
          '<div class="thumb">' + (has ? '<img alt="" src="' + current.photos[s.id].dataURL + '">' : 'No photo') + '</div>' +
          '<div class="cap"><span>' + esc(s.label) + '</span>' +
            '<span class="badge ' + (has ? "have" : "missing") + '">' + (has ? "✓" : "missing") + '</span></div>' +
        '</div>';
    });
    var missing = allShots.filter(function (s) { return !current.photos[s.id]; }).length;

    var card = el(
      '<div class="card">' +
        '<p class="step-label">Review</p>' +
        '<h2 class="title">Review &amp; PDF</h2>' +
        '<p class="hint">Check everything below, then save the PDF report.</p>' +
        lines +
        '<div class="grid">' + tiles + '</div>' +
        (missing ? '<p class="error" style="margin-top:14px">' + missing + ' photo(s) still missing — tap a tile to add.</p>' : '') +
        '<div class="nav" style="margin-top:20px">' +
          '<button class="btn ghost" id="back">Back</button>' +
          '<button class="btn ok" id="save">⬇️ Save PDF</button>' +
        '</div>' +
        '<button class="btn primary" id="submit" style="margin-top:12px">Submit to review</button>' +
        '<p class="hint" style="margin-top:8px;text-align:center">' + (current.status === "submitted" ? "Already submitted — resubmitting updates it." : "Sends this QC to the review dashboard (Final checklist).") + '</p>' +
      '</div>'
    );
    card.querySelectorAll(".tile").forEach(function (tile) {
      tile.addEventListener("click", function () {
        var key = tile.getAttribute("data-goto");
        if (key === "serial") return go(1);
        var i = CHECKLIST.findIndex(function (c) { return c.id === key; });
        if (i >= 0) go(CHECK_START + i);
      });
    });
    card.querySelector("#back").addEventListener("click", function () { go(REVIEW_INDEX - 1); });
    card.querySelector("#save").addEventListener("click", savePdf);
    card.querySelector("#submit").addEventListener("click", function () {
      if (missing && !confirm(missing + " photo(s) still missing. Submit anyway?")) return;
      var btn = card.querySelector("#submit"); btn.disabled = true; btn.textContent = "Submitting…";
      submitMachine(current.id).then(function () {
        current.status = "submitted"; alert("Submitted to review ✓"); goHome();
      }, function (e) { btn.disabled = false; btn.textContent = "Submit to review"; alert("Submit failed — " + (e.message || "check your connection")); });
    });
    if (isEmbedded()) {
      card.querySelector(".nav").insertAdjacentElement("afterend",
        el('<p class="hint" style="margin-top:12px;text-align:center">Hosted preview — to save the PDF, open the standalone file version.</p>'));
    }
    screen.appendChild(card);
  }

  /* =============================================================
   * PDF writer — no external library.
   * Canvas JPEGs (baseline, DeviceRGB) embed directly via DCTDecode.
   * =========================================================== */
  var PAGE_W = 612, PAGE_H = 792, MARGIN = 54;

  function strToBytes(str) { var o = new Uint8Array(str.length); for (var i = 0; i < str.length; i++) o[i] = str.charCodeAt(i) & 0xff; return o; }
  function base64ToBytes(b64) { var b = atob(b64); var o = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; }
  function dataUrlToJpegBytes(dataURL) { return base64ToBytes(dataURL.substring(dataURL.indexOf(",") + 1)); }
  function pdfText(s) {
    return String(s == null ? "" : s).replace(/[\\()]/g, function (c) { return "\\" + c; }).replace(/[^\x20-\x7e]/g, "");
  }
  function concat(arrays) {
    var total = 0, i; for (i = 0; i < arrays.length; i++) total += arrays[i].length;
    var out = new Uint8Array(total), off = 0;
    for (i = 0; i < arrays.length; i++) { out.set(arrays[i], off); off += arrays[i].length; }
    return out;
  }
  function orderedShots() {
    return [{ id: "serial", label: "Full serial number" }].concat(CHECKLIST)
      .filter(function (s) { return current.photos[s.id]; })
      .map(function (s) { return { label: s.label, photo: current.photos[s.id] }; });
  }

  function buildPdf() {
    var shots = orderedShots();
    var objects = [];
    function addObj(bytes) { objects.push(bytes); return objects.length; }
    var catalogNo = 1, pagesNo = 2, fontNo = 3;
    objects.length = 3;
    var kids = [];

    var now = new Date();
    var coverLines = [
      { size: 30, text: "Site " + pdfText(current.siteNumber) },
      { size: 14, gap: 34, text: "Vending Machine QC Report" },
      { size: 13, gap: 40, text: "Serial (last 6): " + pdfText(current.serialLast6) },
      { size: 13, gap: 22, text: "Date: " + pdfText(now.toLocaleString()) },
      { size: 13, gap: 22, text: "Photos: " + shots.length }
    ];
    var cy = PAGE_H - MARGIN - 30, coverStream = "";
    coverLines.forEach(function (ln) {
      cy -= (ln.gap || 0);
      coverStream += "BT /F1 " + ln.size + " Tf 1 0 0 1 " + MARGIN + " " + cy + " Tm (" + ln.text + ") Tj ET\n";
    });
    coverStream += "0.85 0.85 0.85 RG 1 w " + MARGIN + " " + (PAGE_H - MARGIN - 46) + " m " + (PAGE_W - MARGIN) + " " + (PAGE_H - MARGIN - 46) + " l S\n";
    kids.push(addObj(pageObj(addObj(streamObj(coverStream)), null)));

    shots.forEach(function (shot) {
      var imgNo = addObj(imageObj(shot.photo));
      var capY = PAGE_H - MARGIN;
      var stream = "BT /F1 15 Tf 1 0 0 1 " + MARGIN + " " + (capY - 4) + " Tm (" + pdfText(shot.label) + ") Tj ET\n";
      var availW = PAGE_W - 2 * MARGIN, availH = (capY - 24) - MARGIN;
      var iw = shot.photo.w || 1, ih = shot.photo.h || 1;
      var scale = Math.min(availW / iw, availH / ih);
      var dw = iw * scale, dh = ih * scale;
      var dx = MARGIN + (availW - dw) / 2, dy = MARGIN + (availH - dh) / 2;
      stream += "q " + dw.toFixed(2) + " 0 0 " + dh.toFixed(2) + " " + dx.toFixed(2) + " " + dy.toFixed(2) + " cm /Im0 Do Q\n";
      kids.push(addObj(pageObj(addObj(streamObj(stream)), imgNo)));
    });

    objects[catalogNo - 1] = strToBytes("<< /Type /Catalog /Pages " + pagesNo + " 0 R >>");
    objects[pagesNo - 1] = strToBytes("<< /Type /Pages /Count " + kids.length + " /Kids [" + kids.map(function (n) { return n + " 0 R"; }).join(" ") + "] >>");
    objects[fontNo - 1] = strToBytes("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
    return assemble(objects, catalogNo);

    function streamObj(content) { return concat([strToBytes("<< /Length " + content.length + " >>\nstream\n"), strToBytes(content), strToBytes("\nendstream")]); }
    function pageObj(contentNo, imgNo) {
      var res = "/Font << /F1 " + fontNo + " 0 R >>";
      if (imgNo) res += " /XObject << /Im0 " + imgNo + " 0 R >>";
      return strToBytes("<< /Type /Page /Parent " + pagesNo + " 0 R /MediaBox [0 0 " + PAGE_W + " " + PAGE_H + "] /Resources << " + res + " >> /Contents " + contentNo + " 0 R >>");
    }
    function imageObj(photo) {
      var jpeg = dataUrlToJpegBytes(photo.dataURL);
      return concat([
        strToBytes("<< /Type /XObject /Subtype /Image /Width " + (photo.w || 1) + " /Height " + (photo.h || 1) + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpeg.length + " >>\nstream\n"),
        jpeg, strToBytes("\nendstream")
      ]);
    }
  }

  function assemble(objects, rootNo) {
    var chunks = [], offsets = new Array(objects.length + 1), pos = 0;
    function push(bytes) { chunks.push(bytes); pos += bytes.length; }
    push(strToBytes("%PDF-1.4\n%\xe2\xe3\xcf\xd3\n"));
    for (var i = 0; i < objects.length; i++) {
      offsets[i + 1] = pos;
      push(strToBytes((i + 1) + " 0 obj\n")); push(objects[i]); push(strToBytes("\nendobj\n"));
    }
    var xrefStart = pos, n = objects.length + 1;
    var xref = "xref\n0 " + n + "\n0000000000 65535 f \n";
    for (var j = 1; j < n; j++) xref += ("0000000000" + offsets[j]).slice(-10) + " 00000 n \n";
    push(strToBytes(xref));
    push(strToBytes("trailer\n<< /Size " + n + " /Root " + rootNo + " 0 R >>\nstartxref\n" + xrefStart + "\n%%EOF"));
    return concat(chunks);
  }

  function sanitizeName(s) { return String(s || "").replace(/[^A-Za-z0-9_-]+/g, "_").replace(/^_+|_+$/g, "") || "machine"; }
  function pdfFilename() { return "QC_Site-" + sanitizeName(current.siteNumber) + "_" + sanitizeName(current.serialLast6) + ".pdf"; }

  // Render the print-only HTML report (fallback save path).
  function buildPrintReport() {
    var report = document.getElementById("report");
    var allShots = [{ id: "serial", label: "Full serial number" }].concat(CHECKLIST);
    var photosHtml = allShots.map(function (s) {
      var inner = current.photos[s.id] ? '<img alt="" src="' + current.photos[s.id].dataURL + '">' : '<span class="none">No photo captured</span>';
      return '<section class="rpt-photo"><h2>' + esc(s.label) + '</h2><div class="frame">' + inner + '</div></section>';
    }).join("");
    report.innerHTML =
      '<div class="rpt-header"><h1>Vending Machine QC Report</h1><div class="rpt-meta">' +
        '<div><span class="k">Site</span><br><span class="v">' + esc(current.siteNumber || "—") + '</span></div>' +
        '<div><span class="k">Serial (last 6)</span><br><span class="v">' + esc(current.serialLast6 || "—") + '</span></div>' +
        '<div><span class="k">Date</span><br><span class="v">' + esc(new Date().toLocaleString()) + '</span></div>' +
        '<div><span class="k">Photos</span><br><span class="v">' + photoCount(current) + ' of ' + TOTAL_SHOTS + '</span></div>' +
      '</div></div>' + photosHtml;
  }

  // iOS-friendly save: Web Share (Save to Files) → Print → anchor download.
  // Photos loaded from the server carry a remote URL, not base64. Fetch each
  // one as a blob and turn it into a data URL (+ dimensions) so buildPdf can
  // embed it. Freshly captured photos already have base64 and are skipped.
  function ensurePdfBytes(cb) {
    var shots = orderedShots();
    var pending = shots.filter(function (x) { return !/^data:/.test(x.photo.dataURL); });
    if (!pending.length) return cb(null);
    var i = 0, firstErr = null;
    (function next() {
      if (i >= pending.length) return cb(firstErr);
      var ph = pending[i++].photo;
      fetch(ph.dataURL).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); }).then(function (blob) {
        return new Promise(function (res) {
          var fr = new FileReader();
          fr.onload = function () {
            var im = new Image();
            im.onload = function () { ph.dataURL = fr.result; ph.w = im.naturalWidth; ph.h = im.naturalHeight; res(); };
            im.onerror = function () { res(); };
            im.src = fr.result;
          };
          fr.onerror = function () { res(); };
          fr.readAsDataURL(blob);
        });
      }).then(next, function (e) { if (!firstErr) firstErr = e; next(); });
    })();
  }
  function savePdf() {
    ensurePdfBytes(function (err) {
      if (err) { printFallback(); return; }   // couldn't fetch bytes → print report (uses <img> URLs)
      savePdfNow();
    });
  }
  function savePdfNow() {
    var bytes, blob, file;
    try {
      bytes = buildPdf();
      blob = new Blob([bytes], { type: "application/pdf" });
      file = new File([blob], pdfFilename(), { type: "application/pdf" });
    } catch (e) { alert("Sorry — could not build the PDF: " + e.message); return; }

    // 1) Native share sheet (best on iPhone/Android): Save to Files, Mail, etc.
    if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
      navigator.share({ files: [file], title: pdfFilename() }).catch(function (e) {
        if (e && e.name === "AbortError") return;      // user cancelled — done
        printFallback();                                // share failed → print
      });
      return;
    }
    // 2) Desktop / Android Chrome: direct download via anchor.
    if (!isiOS() && supportsDownload()) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = pdfFilename();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return;
    }
    // 3) iOS without Web Share, or anything else: print → Save as PDF.
    printFallback();
  }
  function printFallback() { buildPrintReport(); setTimeout(function () { window.print(); }, 60); }
  function isiOS() {
    return /iP(hone|ad|od)/.test(navigator.platform) ||
      (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));
  }
  function supportsDownload() { return "download" in document.createElement("a"); }

  // Exposed for automated testing only.
  window.__qc = { buildPdf: function () { return buildPdf(); }, get current() { return current; } };

  /* -------------------------------------------------------------
   * Boot
   * ----------------------------------------------------------- */
  goHome();
})();
</script>
